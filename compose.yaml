services:
  backend:
    build:
      context: .
      target: runtime
    image: mordred-backend:local
    restart: unless-stopped
    init: true

    ports:
      - "127.0.0.1:8000:8000"

    read_only: true

    tmpfs:
      - /tmp:size=64m,mode=1777

    security_opt:
      - no-new-privileges:true

    cap_drop:
      - ALL

    networks:
      - mordred-services

    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

networks:
  mordred-services:
    driver: bridge
