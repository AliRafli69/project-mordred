services:
  backend:
    build:
      context: .
      target: runtime
    image: mordred-backend:local
    restart: unless-stopped
    init: true
    env_file:
      - .env

    ports:
      - "${MORDRED_BIND_ADDRESS:-127.0.0.1}:${MORDRED_BIND_PORT:-8000}:8000"

    read_only: true

    tmpfs:
      - /tmp:size=64m,mode=1777

    security_opt:
      - no-new-privileges:true

    cap_drop:
      - ALL

    networks:
      - mordred-services

    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

    secrets:
      - mordred_private_prompt

  telegram-adapter:
    build:
      context: .
      target: runtime
    image: mordred-backend:local
    command:
      - python
      - -m
      - app.telegram_adapter.runner
    restart: unless-stopped
    init: true
    env_file:
      - .env

    depends_on:
      backend:
        condition: service_healthy

    read_only: true

    tmpfs:
      - /tmp:size=64m,mode=1777

    security_opt:
      - no-new-privileges:true

    cap_drop:
      - ALL

    networks:
      - mordred-services

    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

    healthcheck:
      disable: true

networks:
  mordred-services:
    driver: bridge

secrets:
  mordred_private_prompt:
    file: ./prompts/system_prompt.private.txt
